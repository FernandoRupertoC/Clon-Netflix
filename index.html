<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflex</title>

    <!--!Este link es para usar Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!--*Cards-->
<section class="netflix-catalog bg-dark text-white py-4 px-3">
  <h3 class="mb-3 fw-bold">Películas de acción y superhéroes</h3>
  <div class="card-group gap-3">

  <!--Película Hellboy-->
    <div class="card bg-dark text-white border-0 shadow-sm">
      <img src="assets/hellboy.jpg" class="card-img-top img-fluid" style="width:400px; height: 500px;" alt="Hellboy">
      <div class="card-body">
        <h5 class="card-title">Hellboy</h5>
        <p class="card-text">Acción | Comedia | Sci-Fi | Horror</p>
        <span class="badge bg-danger">16+</span>
      </div>
    </div>

    <!--Película Hellboy II-->
    <div class="card bg-dark text-white border-0 shadow-sm">
      <img src="assets/hellboy2.jpg" class="card-img-top img-fluid" style="width:400px; height: 500px;" alt="Hellboy II: El ejercito dorado">
      <div class="card-body">
        <h5 class="card-title">Hellboy II: El ejercito dorado</h5>
        <p class="card-text">Acción | Comedia | Sci-Fi | Horror</p>
        <span class="badge bg-danger">16+</span>
      </div>
    </div>

    <!--Película Deadpool-->
    <div class="card bg-dark text-white border-0 shadow-sm">
      <img src="assets/deadpool.jpg" class="card-img-top img-fluid" style="width:400px; height: 500px;" alt="...">
      <div class="card-body">
        <h5 class="card-title">Deadpool</h5>
        <p class="card-text">Comedia | Acción | Superhero | Drama</p>
        <span class="badge bg-danger">16+</span>
      </div>
    </div>
  </div>

</section>














    <!--!Este va hasta el final del body-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
