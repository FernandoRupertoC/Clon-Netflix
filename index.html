<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    








<!-- Sección completa del formulario -->
<section class="container py-5">

    <div class="newsletter row g-4 align-items-center">

        <!-- Texto del lado izquierdo -->
        <div class="col-lg-6 newsletter-texto">

            <span class="sobrelinea">
                SIN SPOILERS, SOLO ESTRENOS
            </span>

            <h2>
                Tu próxima historia favorita llega por correo.
            </h2>

            <p>
                Recibe novedades, recomendaciones y lanzamientos
                exclusivos una vez por semana.
            </p>

        </div>

        <!-- Formulario del lado derecho -->
        <div class="col-lg-6">

            <!-- Alerta de confirmación -->
            <div
                id="mensajeExito"
                class="alert alert-success alert-dismissible fade d-none"
                role="alert">

                <strong>¡Registro completo!</strong>
                Revisa tu correo para confirmar.

                <button
                    type="button"
                    class="btn-close"
                    aria-label="Cerrar">
                </button>

            </div>

            <form id="formularioSuscripcion" class="row g-2">

                <!-- Correo electrónico -->
                <div class="col-md-8">

                    <label for="correo" class="visually-hidden">
                        Correo electrónico
                    </label>

                    <input
                        id="correo"
                        class="form-control form-control-lg"
                        type="email"
                        placeholder="tu@correo.com"
                        required>

                </div>

                <!-- Botón -->
                <div class="col-md-4 d-grid">

                    <button
                        class="btn btn-acento btn-lg"
                        type="submit">

                        Suscribirme
                    </button>

                </div>

                <!-- Aviso de privacidad -->
                <div class="col-12 mt-3">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="privacidad"
                            required>

                        <label
                            class="form-check-label"
                            for="privacidad">

                            Acepto el aviso de privacidad.
                        </label>

                    </div>

                </div>

            </form>

        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
